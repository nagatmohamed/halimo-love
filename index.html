<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <title>حليمو ❤️</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            height: 100vh;
            overflow: hidden;
            background: linear-gradient(135deg, #ff758c, #ff7eb3);
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
        }

        .box {
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            padding: 50px;
            border-radius: 30px;
            text-align: center;
            color: white;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            z-index: 10;
        }

        h1 {
            font-size: 55px;
            margin: 0 0 10px;
        }

        p {
            font-size: 22px;
        }

        button {
            border: none;
            padding: 15px 30px;
            border-radius: 30px;
            background: white;
            color: #ff4f81;
            font-size: 18px;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            transform: scale(1.1);
        }

        #message {
            display: none;
            margin-top: 25px;
            font-size: 22px;
            line-height: 1.8;
        }

        .heart {
            position: absolute;
            bottom: -50px;
            animation: fly 6s linear infinite;
            font-size: 35px;
        }

        @keyframes fly {
            0% {
                transform: translateY(0) rotate(0deg);
                opacity: 1;
            }

            100% {
                transform: translateY(-110vh) rotate(360deg);
                opacity: 0;
            }
        }

        .h1 { left: 5%; animation-delay: 0s; }
        .h2 { left: 20%; animation-delay: 2s; }
        .h3 { left: 40%; animation-delay: 1s; }
        .h4 { left: 60%; animation-delay: 3s; }
        .h5 { left: 80%; animation-delay: 1.5s; }
        .h6 { left: 95%; animation-delay: 4s; }
    </style>
</head>

<body>

    <!-- القلوب -->
    <div class="heart h1">❤️</div>
    <div class="heart h2">💗</div>
    <div class="heart h3">💕</div>
    <div class="heart h4">💖</div>
    <div class="heart h5">💘</div>
    <div class="heart h6">❤️</div>


    <!-- المحتوى -->
    <div class="box">

        <h1>حليمو ❤️</h1>

        <p>
            أنت أحلى حاجة حصلتلي 🥹💕
        </p>

        <button onclick="showMessage()">
            دوس هنا يا حليمو 💗
        </button>

        <div id="message">
            بحبك يا حليمو ❤️<br>
            ومهما حصل هتفضل ليك مكانة خاصة عندي 🥹💕<br>
            أنت حتة من قلبي 💖
        </div>

    </div>


    <script>
        function showMessage() {

            document.getElementById("message").style.display = "block";

        }
    </script>

</body>
</html>
